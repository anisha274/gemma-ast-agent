[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-ast-agent"
version = "0.1.0"
description = "AST-guided retrieval and self-correcting patch agent for local Gemma 4 models"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
hf = ["torch", "transformers", "accelerate"]
test = ["pytest"]

[tool.setuptools]
packages = ["ast_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
